<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Super Productivity</title>

    <!--
      interactive-widget=resizes-content makes the virtual keyboard shrink the
      *layout* viewport on mobile web (Chrome/Android) instead of only the
      visual viewport (the default `resizes-visual`). This mirrors what the
      native builds already do — Android `adjustResize` and iOS Keyboard
      `resize: 'native'` both resize the WebView — so the fixed global add-task
      bar (position: fixed; bottom) re-anchors above the keyboard on the web app
      the same way it does natively. Ignored where it doesn't apply: native
      WebViews (keyboard handled natively), iOS Safari (unsupported → falls back
      to the JS `--keyboard-height` visualViewport tracking), and desktop.
    -->
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
      name="viewport"
    />
    <link
      href="favicon.ico"
      rel="shortcut icon"
      type="image/x-icon"
    />
    <link
      href="assets/icons/apple-touch-icon.png"
      rel="apple-touch-icon"
      sizes="180x180"
    />
    <link
      href="assets/icons/favicon-16x16.png"
      rel="icon"
      sizes="16x16"
      type="image/png"
    />
    <link
      href="assets/icons/favicon-32x32.png"
      rel="icon"
      sizes="32x32"
      type="image/png"
    />
    <link
      href="assets/icons/favicon-192x192.png"
      rel="icon"
      sizes="192x192"
      type="image/png"
    />
    <link
      color="#5bbad5"
      href="assets/icons/safari-pinned-tab.svg"
      rel="mask-icon"
    />

    <meta
      content="assets/icons/s/mstile-150x150.png"
      name="msapplication-TileImage"
    />
    <meta
      content="#0b77d2"
      name="msapplication-TileColor"
    />

    <link
      href="manifest.json"
      rel="manifest"
    />
    <meta
      content="#0b77d2"
      name="theme-color"
    />
    <meta
      content="yes"
      name="mobile-web-app-capable"
    />
    <meta
      content="#2b5797"
      name="msapplication-TileColor"
    />
    <meta
      content="assets/icons/browserconfig.xml"
      name="msapplication-config"
    />
    <!-- Content-Security-Policy. See GHSA-78rv-m663-4fph.
      'unsafe-eval' and 'unsafe-inline' currently CANNOT be dropped:
        - the plugin runtime runs plugin code via `new Function`
          (src/app/plugins/plugin-runner.ts) → needs 'unsafe-eval';
        - the inline browser-compat bootstrap <script> below also uses
          `new Function` and is inline → needs both.
      The packaged app loads the renderer over file:// (electron/main-window.ts),
      where 'self' is an opaque origin, so tightening script-src to 'self' is
      unreliable. A real lockdown (dropping unsafe-inline/unsafe-eval) needs:
      a registered app:// scheme instead of file://, plugin execution moved into
      a sandboxed iframe/worker, and the inline bootstrap externalized.
      object-src 'none' is safe to set now (the app embeds no <object>/<embed>).
      @see https://content-security-policy.com/ -->
    <meta
      content="default-src * uploaded:;
          connect-src * data: blob: filesystem: uploaded:;
          frame-src * data: blob:;
          font-src * data:;
          img-src * data: blob: filesystem: file:;
          style-src * 'unsafe-inline' ;
          object-src 'none';
          script-src * 'self' 'unsafe-inline' 'unsafe-eval' blob:"
      http-equiv="Content-Security-Policy"
    />
    <base href="./" />
    <style type="text/css">
      html,
      body {
        height: 100%;
      }

      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: rgb(18, 18, 18);
        color: #fff;
      }

      .loading-full-page-wrapper {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        cursor: grab;
        -webkit-app-region: drag;
      }

      .loading-full-page-wrapper:active {
        cursor: grabbing;
      }

      .app-loading {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      .app-loading .logo {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 90px;
        height: 90px;
      }

      .app-loading .logo path {
        fill: #fff;
      }

      @media (prefers-color-scheme: light) {
        body {
          background: transparent;
          background-image: none;
          color: #000000;
        }

        .app-loading .logo path {
          fill: #000;
        }
      }

      .app-loading .spinner {
        position: relative;
        margin: 100px auto;
        width: 120px;
        height: 120px;
      }

      .app-loading .spinner-pulse {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 140px;
        height: 140px;
        margin: -70px 0 0 -70px;
        border-radius: 50%;
        background-color: #6495ed;
        opacity: 0;
        animation: sp-pulse 2s ease-in-out infinite;
      }

      .productivity-tip {
        text-align: center;
        position: absolute;
        left: 50%;
        bottom: 70%;
        width: 400px;
        max-width: 80vw;
        transform: translate(-50%);
        padding-bottom: 10px;
      }

      .app-loading .productivity-tip h2#heading {
        font:
          500 20px/32px 'Open Sans',
          'Helvetica Neue',
          sans-serif;
        margin: 0 0 8px !important;
        color: inherit;
      }

      .app-loading .productivity-tip p {
        font:
          400 14px/20px 'Open Sans',
          'Helvetica Neue',
          sans-serif;
        margin: 0 0 8px !important;
      }

      @keyframes sp-pulse {
        0%,
        100% {
          opacity: 0;
          transform: scale(0.8);
        }
        50% {
          opacity: 0.15;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body class="mat-typography">
    <app-root>
      <div class="loading-full-page-wrapper">
        <div class="app-loading">
          <div class="productivity-tip">
            <h2 id="heading">Heading</h2>
            <p id="text">Text</p>
          </div>

          <div class="spinner">
            <div class="spinner-pulse"></div>
          </div>

          <svg
            class="logo"
            viewBox="0 0 64 64"
          >
            <path
              d="M 0.65537046,34.582787 32.452267,63.855301 63.791548,0.94356422 30.222644,47.722023 Z"
              id="path3395"
              style="
                fill-opacity: 1;
                fill-rule: evenodd;
                stroke: none;
                stroke-width: 1.46761858;
                stroke-linecap: butt;
                stroke-linejoin: bevel;
                stroke-miterlimit: 13.80000019;
                stroke-dasharray: none;
                stroke-opacity: 1;
              "
            />
          </svg>
        </div>
      </div>
    </app-root>
    <noscript>Please enable JavaScript to use this application.</noscript>
    <script src="assets/productivity-tips.js"></script>
    <script>
      // Browser compatibility check — must use ES5 syntax only.
      // The app targets ES2022+ (Safari 18+, Chrome 107+). On older browsers the
      // compiled JS will fail to parse, leaving the user stuck on the splash screen.
      // This detects unsupported browsers early and shows a helpful message.
      (function () {
        var unsupported = false;
        if (typeof structuredClone !== 'function') {
          unsupported = true;
        }
        if (!unsupported) {
          try {
            new Function('class C { static {} }')();
          } catch (e) {
            unsupported = true;
          }
        }
        if (unsupported) {
          var el = document.querySelector('.app-loading');
          if (el) {
            el.innerHTML =
              '<div style="text-align:center;padding:32px 24px;max-width:400px">' +
              '<h2 style="font:500 20px/28px sans-serif;margin:0 0 16px">Browser Update Required</h2>' +
              '<p style="font:400 14px/22px sans-serif;margin:0 0 12px">' +
              'Super Productivity requires a newer browser version to run.' +
              '</p>' +
              '<p style="font:400 14px/22px sans-serif;margin:0">' +
              'Please update your operating system or browser and try again.' +
              '</p>' +
              '</div>';
          }
        }
      })();

      var productivityTips = window.PRODUCTIVITY_TIPS[window.getProductivityTipsLocale()];
      var randomIndex = Math.floor(Math.random() * productivityTips.length);
      window.productivityTips = productivityTips;
      window.randomIndex = randomIndex;
      var headingEl = document.getElementById('heading');
      var textEl = document.getElementById('text');
      if (headingEl && textEl) {
        headingEl.innerText = productivityTips[randomIndex][0];
        textEl.innerText = productivityTips[randomIndex][1];
      }
    </script>
  </body>
</html>
